<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Debts</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14202B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cover">
        <button id="btn-clear-cache" class="tab-refresh" type="button" title="Forzar actualización de la app" aria-label="Actualizar app">↻</button>

        <header class="cover-header">
            <h1>My Debts</h1>
            <div class="balance-line">
                <span class="balance-label">Balance owed</span>
                <span id="total-owed" class="balance-amount">$0.00</span>
            </div>
        </header>

        <nav class="tab-bar" role="tablist">
            <button class="tab-btn active" data-tab="debts" role="tab" aria-selected="true">Deudas</button>
            <button class="tab-btn" data-tab="expenses" role="tab" aria-selected="false">Gastos</button>
        </nav>

        <!-- ===================== PESTAÑA: DEUDAS ===================== -->
        <main class="paper tab-panel active" id="tab-debts">
            <form id="debt-form" class="ledger-entry">
                <div class="field">
                    <input type="text" id="entity" placeholder="Who do you owe?" required>
                </div>

                <div class="field field--amount">
                    <span class="currency" aria-hidden="true">$</span>
                    <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" required>
                </div>

                <div class="field-row">
                    <div class="field field--small">
                        <label for="due-date">Due</label>
                        <input type="date" id="due-date" required>
                    </div>
                    <div class="field field--small">
                        <label for="reminder-date">Remind</label>
                        <input type="datetime-local" id="reminder-date">
                    </div>
                </div>

                <div class="field">
                    <label for="repeats">Repeats</label>
                    <select id="repeats">
                        <option value="none">No se repite</option>
                        <option value="monthly">Mensual (mismo día)</option>
                        <option value="custom-days">Fechas fijas del mes (tú eliges)</option>
                    </select>
                </div>

                <div class="field" id="custom-days-field" hidden>
                    <label>Días del mes</label>
                    <div class="day-picker" id="day-picker"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-stamp" id="submit-btn">Add Debt</button>
                    <button type="button" class="btn-cancel-edit" id="cancel-edit-btn" hidden>Cancelar edición</button>
                </div>
            </form>

            <ul id="debt-list" class="ledger-list"></ul>
        </main>

        <!-- ===================== PESTAÑA: GASTOS ===================== -->
        <main class="paper tab-panel" id="tab-expenses" hidden>
            <div class="cards-overview">
                <div class="card-buttons">
                    <button type="button" class="card-btn" data-card="Bgral">Bgral</button>
                    <button type="button" class="card-btn" data-card="StG99">StG99</button>
                    <button type="button" class="card-btn" data-card="Globank">Globank</button>
                </div>
                <div class="card-detail" id="card-detail" hidden>
                    <p class="card-detail-balance">Debes <span id="card-detail-amount">$0.00</span> en <span id="card-detail-name"></span></p>
                    <div class="field field--small">
                        <label for="card-cutoff-day">Fecha de corte (día del mes)</label>
                        <input type="number" id="card-cutoff-day" min="1" max="31" placeholder="ej. 22">
                    </div>
                    <div class="card-detail-actions">
                        <button type="button" id="card-mark-paid-btn" class="btn-cancel-edit">Marcar tarjeta como pagada</button>
                    </div>
                    <p class="card-detail-meta" id="card-detail-meta"></p>
                </div>
            </div>

            <form id="expense-form" class="ledger-entry">
                <div class="field-row">
                    <div class="field">
                        <label for="expense-category">Rubro</label>
                        <select id="expense-category">
                            <option value="alimentos">Alimentos</option>
                            <option value="gasolina">Gasolina</option>
                            <optgroup label="Servicios">
                                <option value="agua">Agua</option>
                                <option value="luz">Naturgy (luz)</option>
                                <option value="internet_tv">Masmovil (internet/TV)</option>
                                <option value="data">Masmovil (data)</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="field">
                        <label for="expense-card">Tarjeta</label>
                        <select id="expense-card">
                            <option value="Bgral">Bgral</option>
                            <option value="StG99">StG99</option>
                            <option value="Globank">Globank</option>
                        </select>
                    </div>
                </div>

                <div class="field field--amount">
                    <span class="currency" aria-hidden="true">$</span>
                    <input type="number" id="expense-amount" placeholder="0.00" step="0.01" min="0" required>
                </div>

                <div class="field-row">
                    <div class="field field--small">
                        <label for="expense-date">Fecha</label>
                        <input type="date" id="expense-date" required>
                    </div>
                    <div class="field field--small">
                        <label for="expense-note">Nota (opcional)</label>
                        <input type="text" id="expense-note" placeholder="ej. Súper Rey">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-stamp" id="expense-submit-btn">Add Expense</button>
                    <button type="button" class="btn-cancel-edit" id="expense-cancel-edit-btn" hidden>Cancelar edición</button>
                </div>
            </form>

            <div class="month-nav">
                <button type="button" id="prev-month" aria-label="Mes anterior">←</button>
                <span id="current-month-label"></span>
                <button type="button" id="next-month" aria-label="Mes siguiente">→</button>
            </div>

            <div class="summary-grid">
                <div class="summary-block">
                    <h4>Por tarjeta</h4>
                    <ul id="summary-by-card" class="summary-list"></ul>
                </div>
                <div class="summary-block">
                    <h4>Por rubro</h4>
                    <ul id="summary-by-category" class="summary-list"></ul>
                </div>
            </div>

            <ul id="expense-list" class="ledger-list"></ul>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
